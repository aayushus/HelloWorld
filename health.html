<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garick System Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .status-card {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    .status-icon {
      display: block;
      margin: 0 auto 12px;
      width: 48px;
      height: 48px;
    }
    .badge {
      display: inline-block;
      background-color: #28a745;
      color: #ffffff;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="status-card">
    <svg xmlns="http://www.w3.org/2000/svg" class="status-icon" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="System status: Operational" aria-describedby="status-icon-desc">
      <title id="status-icon-title">System status: Operational</title>
      <desc id="status-icon-desc">Green check mark icon indicating all systems are operational.</desc>
      <circle cx="24" cy="24" r="22" fill="#e6f4ea" stroke="#28a745" stroke-width="2" />
      <circle cx="24" cy="24" r="16" fill="#28a745" />
      <path d="M17 24.5l4.5 4.5 9.5-9.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h1>Garick System: Operational</h1>
    <span class="badge" style="background-color: #28a745; color: #ffffff;">Operational</span>
  </main>
</body>
</html>
