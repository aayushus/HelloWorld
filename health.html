<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garick System Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .status-card {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background-color: #28a745;
      color: #ffffff;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="status-card">
    <h1>Garick System: Operational</h1>
    <span class="badge" style="background-color: #28a745; color: #ffffff;">Operational</span>
  </main>
</body>
</html>
