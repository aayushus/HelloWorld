<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status — Garick</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
    }
    main {
      max-width: 640px;
      margin: 2rem auto;
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 1rem 0;
      font-size: 1.75rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .badge-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #16a34a;
      display: inline-block;
    }
  </style>
</head>
<body>
  <main>
    <h1>Garick System: Operational</h1>
    <p>
      <span class="badge operational" role="status" aria-label="Operational">
        <span class="badge-dot" aria-hidden="true"></span>
        Operational
      </span>
    </p>
  </main>
</body>
</html>
