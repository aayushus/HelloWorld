<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 2rem auto; max-width: 720px; padding: 0 1rem; line-height: 1.5; color: #1f2937; background: #fff; }
    h1 { margin-bottom: 0.5rem; }
    p { margin: 0 0 1rem; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    input[type="email"] { flex: 1 1 240px; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    button { padding: 0.6rem 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Newsletter</h1>
  <p>Get a short monthly roundup of HelloWorld updates, tips, and new features delivered to your inbox. No spam, unsubscribe anytime.</p>
  <form action="#" method="post">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" required>
    <button type="submit">Subscribe</button>
  </form>
</body>
</html>
