<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing</title>
</head>
<body style="margin:0;font-family:Arial,Helvetica,sans-serif;line-height:1.5;color:#222;background:#fff;">
  <main style="max-width:720px;margin:40px auto;padding:0 16px;">
    <h1>Pricing</h1>
    <p>Simple monthly plans for teams of any size.</p>
    <table style="width:100%;border-collapse:collapse;margin-top:16px;">
      <thead>
        <tr>
          <th style="text-align:left;border:1px solid #ccc;padding:10px;background:#f5f5f5;">Plan</th>
          <th style="text-align:left;border:1px solid #ccc;padding:10px;background:#f5f5f5;">Monthly price</th>
          <th style="text-align:left;border:1px solid #ccc;padding:10px;background:#f5f5f5;">Includes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="border:1px solid #ccc;padding:10px;">Starter</td>
          <td style="border:1px solid #ccc;padding:10px;">$9 / month</td>
          <td style="border:1px solid #ccc;padding:10px;">For individuals getting started</td>
        </tr>
        <tr>
          <td style="border:1px solid #ccc;padding:10px;">Team</td>
          <td style="border:1px solid #ccc;padding:10px;">$29 / month</td>
          <td style="border:1px solid #ccc;padding:10px;">For small teams collaborating</td>
        </tr>
        <tr>
          <td style="border:1px solid #ccc;padding:10px;">Business</td>
          <td style="border:1px solid #ccc;padding:10px;">$79 / month</td>
          <td style="border:1px solid #ccc;padding:10px;">For growing businesses</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
